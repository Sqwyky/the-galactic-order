<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Galactic Order - Planetary Landing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #game-canvas { display: block; width: 100vw; height: 100vh; }

        /* Atmosphere overlay — gets more opaque as we descend */
        #atmos-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* Vignette — now handled by GPU post-processing shader */
        /* CSS overlay removed to avoid double-vignette */

        /* HUD */
        #hud {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        /* Planet name banner */
        #planet-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s;
        }
        #planet-banner.visible { opacity: 1; }
        #planet-banner h1 {
            color: #fff;
            font-size: 36px;
            letter-spacing: 12px;
            text-shadow: 0 0 30px rgba(0,200,255,0.3);
            font-weight: 300;
        }
        #planet-banner .subtitle {
            color: #556;
            font-size: 12px;
            letter-spacing: 4px;
            margin-top: 8px;
        }

        /* Altitude HUD */
        #altitude-hud {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        #altitude-hud .altitude {
            color: #00ff88;
            font-size: 24px;
            letter-spacing: 3px;
        }
        #altitude-hud .label {
            color: #445;
            font-size: 10px;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* Status bar */
        #status-bar {
            position: absolute;
            top: 16px;
            left: 16px;
        }
        #status-bar .phase {
            color: #00ff88;
            font-size: 12px;
            letter-spacing: 3px;
        }
        #status-bar .info {
            color: #334;
            font-size: 10px;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Controls hint */
        #controls-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            opacity: 0;
            transition: opacity 1s;
        }
        #controls-hint.visible { opacity: 1; }
        #controls-hint .key {
            display: inline-block;
            border: 1px solid rgba(0,255,136,0.3);
            color: #00ff88;
            padding: 3px 8px;
            font-size: 10px;
            margin: 0 2px;
            letter-spacing: 1px;
        }
        #controls-hint .desc {
            color: #445;
            font-size: 10px;
            margin-top: 6px;
        }

        /* Perf */
        #perf {
            position: absolute;
            top: 16px;
            right: 16px;
            color: #333;
            font-size: 10px;
            text-align: right;
        }

        /* Crosshair */
        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px; height: 20px;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #crosshair.visible { opacity: 0.5; }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
        }
        #crosshair::before {
            width: 1px; height: 100%;
            left: 50%; top: 0;
        }
        #crosshair::after {
            width: 100%; height: 1px;
            top: 50%; left: 0;
        }

        /* Loading */
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 2s;
        }
        #loading.fade { opacity: 0; pointer-events: none; }
        #loading h2 {
            color: #00ff88;
            font-size: 14px;
            letter-spacing: 6px;
        }
        #loading .bar { width: 300px; height: 2px; background: #111; margin-top: 20px; }
        #loading .bar-fill { height: 100%; background: #00ff88; width: 0%; transition: width 0.3s; }
        #loading .status { color: #444; font-size: 11px; margin-top: 12px; }

        /* Scan lines removed — was adding fuzzy pixel noise */
    </style>
</head>
<body>

<canvas id="game-canvas"></canvas>
<!-- vignette moved to GPU post-processing -->
<!-- scanlines removed -->
<div id="atmos-overlay"></div>
<div id="crosshair"></div>

<div id="hud">
    <div id="planet-banner">
        <h1 id="bannerName">PLANET</h1>
        <div class="subtitle" id="bannerSubtitle"></div>
    </div>

    <div id="altitude-hud">
        <div class="altitude" id="altitudeValue">---</div>
        <div class="label">ALTITUDE</div>
    </div>

    <div id="status-bar">
        <div class="phase" id="phaseName">ATMOSPHERIC ENTRY</div>
        <div class="info" id="phaseInfo"></div>
    </div>

    <div id="controls-hint">
        <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
        <span class="key">SHIFT</span>
        <span class="key">SPACE</span>
        <span class="key">E</span>
        <div class="desc">MOVE · SPRINT · JUMP · BOARD SHIP — CLICK TO MINE/LOOK</div>
    </div>

    <div id="perf"></div>
</div>

<div id="loading">
    <h2>ATMOSPHERIC ENTRY</h2>
    <div class="bar"><div class="bar-fill" id="loadingBar"></div></div>
    <div class="status" id="loadingStatus">Calculating descent vector...</div>
</div>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { TerrainManager, TERRAIN_CONFIG } from './js/terrain/TerrainChunk.js';
import { WalkingController } from './js/terrain/WalkingController.js';
import { hashSeed } from './js/generation/hashSeed.js';
import { classifyRule } from './js/generation/cellularAutomata.js';
import { generatePlanetName } from './js/generation/nameGenerator.js';
import { NPCManager } from './js/npc/NPCManager.js';
import { DialogueSystem } from './js/ui/DialogueSystem.js';
import { TabletUI } from './js/ui/TabletUI.js';
import { SkyDome } from './js/rendering/SkyDome.js';
import { GrassSystem } from './js/terrain/GrassSystem.js';
import { RockScatter } from './js/terrain/RockScatter.js';
import { AtmosphericParticles } from './js/rendering/AtmosphericParticles.js';
import { AlienFloraSystem } from './js/terrain/AlienFlora.js';
import { derivePlanetMood, derivePlanetFrequency, frequencyToNote } from './js/generation/harmonicResonance.js';

// Ship systems
import { ShipModel } from './js/ship/ShipModel.js';
import { FlightController } from './js/ship/FlightController.js';
import { WeaponSystem } from './js/ship/WeaponSystem.js';
import { ScannerSystem } from './js/ship/ScannerSystem.js';
import { HyperspaceSystem } from './js/ship/HyperspaceSystem.js';
import { ShipHUD } from './js/ui/ShipHUD.js';
import { PowerSystem } from './js/ship/systems/PowerSystem.js';
import { DamageSystem } from './js/ship/systems/DamageSystem.js';

// Mining & Crafting systems
import { MiningSystem } from './js/terrain/MiningSystem.js';
import { InventoryManager } from './js/ui/InventoryManager.js';
import { MiningHUD } from './js/ui/MiningHUD.js';
import { ELEMENTS } from './js/generation/HarmonicElements.js';
import { PerformanceManager } from './js/rendering/PerformanceManager.js';
import { CascadeShadowManager } from './js/rendering/CascadeShadowManager.js';

// Creature system
import { CreatureSystem } from './js/creatures/CreatureSystem.js';

// Audio system
import { AudioSystem } from './js/audio/AudioSystem.js';

// Terminal & AI systems
import { TerminalSystem } from './js/terminal/TerminalSystem.js';
import { GeminiService } from './js/ai/GeminiService.js';

// Quest system
import { QuestSystem } from './js/quest/QuestSystem.js';

// Ship interiors, crew, HUD
import { HUDManager } from './js/ui/hud/HUDManager.js';
import { StationManager } from './js/ship/crew/StationManager.js';
import { ShipInterior } from './js/ship/interior/ShipInterior.js';
import { SHIP_CLASSES } from './js/ship/ShipClassRegistry.js';

// API client (save/load)
import { api } from './js/core/API.js';

// Game Manager (replaces inline game loop)
import { GameManager } from './js/core/GameManager.js';

// Post-processing pipeline (encapsulates all passes)
import { PostProcessingPipeline } from './js/rendering/PostProcessingPipeline.js';

// Rendering systems still needed directly
import { createTriplanarTerrainMaterial } from './js/rendering/TriplanarTerrainMaterial.js';
import { WindField } from './js/rendering/WindField.js';
import { WeatherSystem, WEATHER_STATE } from './js/rendering/WeatherSystem.js';
import { ResolutionScaler } from './js/rendering/ResolutionScaler.js';
import { eventBus } from './js/core/EventBus.js';
import { PlanetTransition } from './js/core/PlanetTransition.js';

// ============================================================
// URL PARAMS — planet identity
// ============================================================
const params = new URLSearchParams(window.location.search);
let planetRule = parseInt(params.get('rule')) || 30;
let planetSeed = parseInt(params.get('seed')) || 42;
let planetName = params.get('name') || generatePlanetName(hashSeed(planetSeed, 'planet', 0));

// ============================================================
// LOADING
// ============================================================
const loadingEl = document.getElementById('loading');
const loadingBar = document.getElementById('loadingBar');
const loadingStatus = document.getElementById('loadingStatus');
function setLoading(pct, msg) {
    loadingBar.style.width = pct + '%';
    loadingStatus.textContent = msg;
}

// ============================================================
// GAME STATE (managed by GameManager)
// ============================================================
let currentPhase = 'DESCENT'; // Kept for backward compat, synced by GameManager

// ============================================================
// RENDERER
// ============================================================
setLoading(10, 'Creating renderer...');
console.log('[TGO] Init: Creating renderer...');
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Dynamic resolution scaling — render at lower res on weak devices, native on strong
const resolutionScaler = new ResolutionScaler(renderer, canvas);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
// Soft shadow maps — controlled by performance tier (disabled on LOW/POTATO)
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Post-processing pipeline import (replaces inline setup)
// Pipeline created after camera is available (see below)

const scene = new THREE.Scene();

// ============================================================
// ATMOSPHERE / SKY
// ============================================================
console.log('[TGO] Init: Composer ready, generating atmosphere...');
setLoading(15, 'Generating atmosphere...');

// Determine atmosphere from Harmonic Resonance system (Antigravity Brain integration)
// The planet's CA rule → brainwave frequency → mood → sky colors, fog, atmosphere
let classification = classifyRule(planetRule);
let planetMood = derivePlanetMood(planetRule, planetSeed);
let planetFreq = derivePlanetFrequency(planetRule, planetSeed);
let planetNote = frequencyToNote(planetFreq.frequency);

// Sky colors driven by the planet's resonant frequency band
const skyTopColor = new THREE.Color(...planetMood.sky.topColor);
const skyBottomColor = new THREE.Color(...planetMood.sky.bottomColor);
const fogColor = new THREE.Color(...planetMood.sky.fogColor);
const sunColor = new THREE.Color(...planetMood.sky.sunColor);

// Atmosphere tint for re-entry overlay
let fc = planetMood.sky.fogColor;
let atmosTint = `rgba(${Math.round(fc[0]*255)},${Math.round(fc[1]*255)},${Math.round(fc[2]*255)},`;

console.log(`[TGO] Planet mood: ${planetMood.bandLabel} (${planetMood.moodName}) ` +
    `@ ${planetFreq.frequency.toFixed(2)}Hz (${planetNote.display}) ` +
    `| Schumann distance: ${planetFreq.schumannDistance.toFixed(2)}Hz` +
    (planetMood.isSchumannResonant ? ' ★ RESONANT' : ''));

// ---- Audio System — procedural sound from planet frequency ----
const audioSystem = new AudioSystem();
audioSystem.init();
audioSystem.setPlanet({
    rule: planetRule,
    seed: planetSeed,
    mood: planetMood,
    frequency: planetFreq,
    archetype: classification.label,
});

// Fog density driven by planet mood (Delta = thick fog, Alpha = clear, Gamma = toxic haze)
let moodFogDensity = planetMood.atmosphere.fogDensity;
scene.fog = new THREE.FogExp2(fogColor, moodFogDensity);

// NMS-style gradient sky dome — colors from harmonic resonance system
const skyDome = new SkyDome({
    topColor: skyTopColor,
    midColor: skyBottomColor,
    bottomColor: fogColor,
    fogColor: fogColor,
    sunDirection: new THREE.Vector3(0.5, 0.3, 0.4).normalize(),
    sunColor: sunColor,
});
skyDome.addToScene(scene); // Also sets scene.background = null

// ============================================================
// LIGHTING
// ============================================================
console.log('[TGO] Init: Sky dome ready, creating lights...');
setLoading(20, 'Igniting local star...');

// Main sun — directional with shadow casting
const sunLight = new THREE.DirectionalLight(sunColor, 2.8);
sunLight.position.set(100, 80, 60);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 0.5;
sunLight.shadow.camera.far = 300;
sunLight.shadow.camera.left = -80;
sunLight.shadow.camera.right = 80;
sunLight.shadow.camera.top = 80;
sunLight.shadow.camera.bottom = -80;
sunLight.shadow.bias = -0.0005;
sunLight.shadow.normalBias = 0.02;
scene.add(sunLight);
scene.add(sunLight.target);

// Cascade Shadow Manager — multi-frustum shadows for quality across distances
const csmManager = new CascadeShadowManager(scene, sunLight);
csmManager.setSunDirection(new THREE.Vector3(-100, -80, -60).normalize());

// Ambient light intensity from mood (Delta worlds are dimmer, Beta worlds brighter)
const ambientLight = new THREE.AmbientLight(skyBottomColor, planetMood.atmosphere.ambientLight);
scene.add(ambientLight);

// Hemisphere light — sky color from above, warm earth tone from below
// This makes shadows take on the sky tint (blue shadows on blue worlds, etc.)
const hemiLight = new THREE.HemisphereLight(skyTopColor, 0x443322, 0.8);
scene.add(hemiLight);

// Fill light — warm bounce from below, prevents pitch-black undersides
const fillLight = new THREE.DirectionalLight(0xffaa66, 0.35);
fillLight.position.set(-30, -20, 20);
scene.add(fillLight);

// Rim light — subtle backlight that separates objects from background
const rimLight = new THREE.DirectionalLight(skyTopColor, 0.25);
rimLight.position.set(-50, 40, -80);
scene.add(rimLight);

// ============================================================
// CAMERA
// ============================================================
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 5000);
// Start high up for descent
camera.position.set(0, 200, 0);
camera.lookAt(0, 0, 0);

// ============================================================
// POST-PROCESSING PIPELINE (encapsulated — color grade + film grain merged)
// ============================================================
console.log('[TGO] Init: Creating post-processing pipeline...');
const pipeline = new PostProcessingPipeline(renderer, scene, camera, {
    skyTopColor, fogColor, sunColor,
    sunDirection: new THREE.Vector3(0.5, 0.3, 0.4).normalize(),
    moodFogDensity,
    bloomStrength: planetMood.atmosphere.bloomStrength,
    scatterStrength: planetMood.atmosphere.bloomStrength > 0.4 ? 1.2 : 0.8,
    planetMood,
});

// Disable SkyDome 2D clouds if volumetric clouds are active
if (pipeline.passes.volumetricClouds) {
    skyDome.setCloudsEnabled(false);
}

// Expose pass aliases for backward-compatible references
const composer = pipeline.composer;
const { taaPass, ssaoPass, bloomPass, ssrPass, autoExposure,
        volumetricClouds, atmospherePass, motionBlurPass, dofPass,
        contactShadowPass, ssgiPass, lensFlarePass, lensDirtPass,
        fxaaPass, combinedGradePass } = pipeline.passes;
// Combined grade replaces separate colorGradePass + filmGrainPass
const colorGradePass = combinedGradePass;
const filmGrainPass = combinedGradePass;

// ============================================================
// TERRAIN
// ============================================================
console.log('[TGO] Init: Post-processing pipeline ready, generating terrain...');
setLoading(30, `Generating terrain (Rule ${planetRule})...`);

let terrainManager = new TerrainManager(scene, {
    rule: planetRule,
    seed: planetSeed,
    moistureRule: (planetRule + 73) & 0xFF,
});
// Uses TERRAIN_CONFIG defaults (heightScale: 15, waterLevel: 0, etc.)

// 2026 UPGRADE: Triplanar PBR terrain material
// Replaces flat vertex colors with triplanar-mapped procedural normals + PBR lighting
let triplanarMaterial = createTriplanarTerrainMaterial({
    fogColor: fogColor,
    fogDensity: moodFogDensity,
    sunDirection: new THREE.Vector3(0.5, 0.3, 0.4).normalize(),
    sunColor: sunColor,
    skyColor: skyTopColor,
});
terrainManager.setTriplanarMaterial(triplanarMaterial);

// NMS-style instanced grass — populates terrain near the camera
let grassSystem = new GrassSystem(scene, {
    baseColor: new THREE.Color(0x1a5e12), // Dark grass base (fake AO)
    tipColor: new THREE.Color(0x7ec850),  // Bright grass tips (sunlit)
    fogColor: fogColor,
    fogDensity: moodFogDensity,
});

// Scattered rocks — shapes derived from CA rule (supershape rocks)
let rockScatter = new RockScatter(scene, {
    planetRule: planetRule,
    rockSeed: hashSeed(planetSeed, 'rock'),
    rockColor: new THREE.Color(0x8a7d6b), // Fallback color
    fogColor: fogColor,
});

// Alien flora — supershape geometries driven by the planet's CA rule
// Wind strength from mood (Delta = still, Gamma = strong winds)
let alienFlora = new AlienFloraSystem(scene, {
    planetRule: planetRule,
    floraSeed: hashSeed(planetSeed, 'flora'),
    fogColor: fogColor,
    fogDensity: moodFogDensity,
    windStrength: planetMood.atmosphere.windStrength,
});

// Water plane — animated wave shader, follows camera
const sunDir = new THREE.Vector3(0.5, 0.3, 0.4).normalize();
terrainManager.createWater(fogColor, sunDir);

// Atmospheric dust/pollen particles — count + speed from planet mood
let atmosphericParticles = new AtmosphericParticles(scene, {
    color: new THREE.Color(0xddcc99),  // Warm dust motes
    fogColor: fogColor,
    fogDensity: moodFogDensity,
    count: planetMood.atmosphere.particleCount,
});

// 2026 UPGRADE: Wind field — spatially coherent gusts for all vegetation
let windField = new WindField({
    baseStrength: planetMood.atmosphere.windStrength || 0.15,
    gustStrength: 0.4,
    windDirection: new THREE.Vector2(0.7, 0.3),
    scrollSpeed: 5.0,
});

// Connect WindField to vegetation — spatially coherent gust waves across landscape
grassSystem.setWindField(windField);
alienFlora.setWindField(windField);

// Ground fill plane — prevents seeing sky color below terrain edges
// A huge flat plane at y=-1 colored to blend with distant terrain/fog
const groundFillGeo = new THREE.PlaneGeometry(10000, 10000);
groundFillGeo.rotateX(-Math.PI / 2);
const groundFillMat = new THREE.MeshBasicMaterial({ color: fogColor });
const groundFill = new THREE.Mesh(groundFillGeo, groundFillMat);
groundFill.position.y = -1;
scene.add(groundFill);

// ============================================================
// WALKING CONTROLLER
// ============================================================
const walker = new WalkingController(camera, canvas, (x, z) => {
    return terrainManager.getHeightAt(x, z);
});

// ============================================================
// TABLET UI
// ============================================================
const tablet = new TabletUI({
    onKeySubmit: async (key) => {
        tablet.addDiscovery('Validating Key of Insight...', 'encounter');
        const valid = await geminiService.setKey(key);
        if (valid) {
            tablet.addDiscovery('Key of Insight accepted. The Architect awakens...', 'encounter');
            console.log('[TGO] Gemini API key validated — AI dialogue enabled');
        } else {
            tablet.addDiscovery('Key rejected. The Architect remains silent.', 'encounter');
            console.warn('[TGO] Gemini API key validation failed');
        }
    },
    planetData: {
        name: planetName,
        rule: planetRule,
        ruleClass: classification.class,
        ruleLabel: classification.label,
    },
});
tablet.setPlanetData({
    name: planetName,
    rule: planetRule,
    ruleClass: classification.class,
    ruleLabel: classification.label,
    archetype: classification.label,
    atmosphere: planetMood.moodName.charAt(0).toUpperCase() + planetMood.moodName.slice(1),
    hazard: planetMood.band === 'gamma' ? 'Extreme' : planetMood.band === 'beta' ? 'Moderate' : 'Low',
    frequency: `${planetFreq.frequency.toFixed(2)}Hz`,
    musicalNote: planetNote.display,
    brainwaveBand: planetMood.bandLabel,
    mood: planetMood.moodName,
    schumannResonant: planetMood.isSchumannResonant,
});

// ============================================================
// INVENTORY & MINING SYSTEMS
// ============================================================
const inventory = new InventoryManager();
const miningHUD = new MiningHUD();

// Mining system — Molecular Deconstructor
const miningSystem = new MiningSystem(scene, camera, {
    planetRule: planetRule,
    planetSeed: planetSeed,
    planetFrequency: planetFreq.frequency,
    inventory: inventory,
    onResourceCollected: (elementId, quantity, bonus) => {
        const el = ELEMENTS[elementId];
        if (el) {
            miningHUD.showPickup(el.symbol, quantity, el.color, bonus);
            tablet.addDiscovery(`Mined ${quantity} ${el.name} (${el.symbol})${bonus ? ' — ' + bonus : ''}`);
            audioSystem.resourceCollected(elementId);
        }
        audioSystem.destruction();
    },
});

// Link inventory to tablet
tablet.setInventory(inventory);

// Wire save/load handlers
tablet.setSaveHandlers({
    onSave: async (slot) => {
        if (!api.isLoggedIn) throw new Error('Not logged in');
        await api.save(slot, buildSaveState());
    },
    onLoad: async (slot) => {
        if (!api.isLoggedIn) throw new Error('Not logged in');
        return api.load(slot);
    },
    onListSaves: async () => {
        if (!api.isLoggedIn) return [];
        return api.listSaves();
    },
});

// Performance manager — adaptive quality that looks good on ALL devices
const perfManager = new PerformanceManager(renderer);

// 2026: Procedural Weather System — state machine driving all atmosphere subsystems
let weatherSystem = null;
try {
    weatherSystem = new WeatherSystem({
        scene: scene,
        volumetricClouds: volumetricClouds,
        atmospherePass: atmospherePass,
        triplanarMaterial: triplanarMaterial,
        windField: windField,
        skyDome: skyDome,
    });
} catch (e) {
    console.warn('[TGO] Weather system disabled:', e.message);
}

// Register all rendering passes with performance manager (single unified call)
perfManager.registerPasses({
    composer, ssaoPass, bloomPass, filmGrainPass, colorGradePass,
    taaPass, ssrPass, autoExposure, volumetricClouds, atmospherePass,
    skyDome, csmManager,
    motionBlurPass, dofPass, contactShadowPass, ssgiPass,
    weatherSystem, triplanarMaterial,
    lensFlarePass, lensDirtPass, fxaaPass, resolutionScaler,
});

// Set bloom base strength from planet mood (dreamy Delta = more bloom, etc.)
perfManager.setBloomBaseStrength(planetMood.atmosphere.bloomStrength);

// When quality tier changes, propagate to mining system
perfManager.onQualityChanged((tierName, settings) => {
    miningSystem.setQuality({
        quality: tierName,
        miningParticleCount: settings.miningParticleCount,
        miningBeamParticles: true,     // Keep beam particles at all tiers
        miningCrystalTrail: tierName !== 'POTATO',
    });
});

// ============================================================
// NPC MANAGER — The Mysterious Being
// ============================================================
let npcManager = new NPCManager(scene, {
    seed: planetSeed,
    rule: planetRule,
}, (x, z) => terrainManager.getHeightAt(x, z));

// ============================================================

function buildShipSelectionUI() {
    const overlay = document.createElement('div');
    overlay.id = 'ship-select-overlay';
    overlay.style.cssText = `
        display:none; position:fixed; inset:0; z-index:50;
        background:rgba(0,2,4,0.95); backdrop-filter:blur(8px);
    `;
    const grid = document.createElement('div');
    grid.style.cssText = `
        display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
        max-width:800px; margin:60px auto; padding:24px;
    `;
    const title = document.createElement('h2');
    title.textContent = 'SELECT SHIP CLASS';
    title.style.cssText = `
        color:#00ff88; font-family:'Courier New',monospace; text-align:center;
        letter-spacing:6px; font-size:14px; margin:40px 0 0; grid-column:1/-1;
    `;
    grid.appendChild(title);

    for (const [id, cls] of Object.entries(SHIP_CLASSES)) {
        const card = document.createElement('div');
        card.className = 'ship-card';
        card.style.cssText = `
            border:1px solid rgba(0,255,136,0.15); padding:16px; cursor:pointer;
            transition:all 0.3s; background:rgba(0,10,5,0.6);
        `;
        card.innerHTML = `
            <div style="color:#00ff88;font-family:'Courier New',monospace;font-size:12px;letter-spacing:2px;margin-bottom:8px">${cls.name.toUpperCase()}</div>
            <div style="color:#667;font-family:'Courier New',monospace;font-size:10px">Class: ${cls.class.toUpperCase()} · Tier ${cls.tier}</div>
            <div style="color:#556;font-family:'Courier New',monospace;font-size:10px;margin-top:4px">Crew: ${cls.crew.min}-${cls.crew.max} · Hull: ${cls.stats.hull} · Speed: ${cls.stats.speed}</div>
            <div style="color:#445;font-family:'Courier New',monospace;font-size:9px;margin-top:4px">${cls.hasWalkableInterior ? '✦ Walkable Interior' : '○ Cockpit Only'}</div>
        `;
        card.addEventListener('mouseenter', () => {
            card.style.borderColor = 'rgba(0,255,136,0.5)';
            card.style.background = 'rgba(0,20,10,0.8)';
        });
        card.addEventListener('mouseleave', () => {
            card.style.borderColor = 'rgba(0,255,136,0.15)';
            card.style.background = 'rgba(0,10,5,0.6)';
        });
        card.addEventListener('click', () => {
            overlay.style.display = 'none';
            selectShipClass(id);
        });
        grid.appendChild(card);
    }
    overlay.appendChild(grid);
    document.body.appendChild(overlay);
    return overlay;
}

const shipSelectOverlay = buildShipSelectionUI();

function selectShipClass(classId) {
    const cls = SHIP_CLASSES[classId];
    if (!cls) return;
    console.log(`[TGO] Ship class selected: ${cls.name} (${classId})`);

    // Remove old ship from scene
    const oldPos = shipModel.group.position.clone();
    const oldVisible = shipModel.group.visible;
    shipModel.removeFromScene(scene);
    shipModel.dispose();

    // Rebuild with new class
    const newShip = new ShipModel({
        classId: classId,
        hullColor: new THREE.Color(cls.visual?.defaultColors?.hull ?? 0x5a6577),
        accentColor: new THREE.Color(cls.visual?.defaultColors?.accent ?? 0xb83232),
        engineColor: new THREE.Color(cls.visual?.defaultColors?.engine ?? 0x33ddff),
    });
    newShip.setLandingGear(true);
    newShip.group.position.copy(oldPos);
    newShip.group.visible = oldVisible;
    newShip.addToScene(scene);

    // Replace references
    shipModel = newShip;
    systems.shipModel = shipModel;

    // Update station manager for new class
    const newStationPos = shipModel.getStationPositions();
    try {
        if (stationManager) stationManager.dispose();
        stationManager = new StationManager(cls, newStationPos);
        stationManager.setLocalPlayer('local');
        stationManager.assignStation('pilot', 'local', 'Player');
        systems.stationManager = stationManager;
    } catch (e) {
        console.warn('[TGO] StationManager rebuild failed:', e.message);
    }

    // Rebuild interior if walkable
    if (shipInterior) {
        shipInterior.dispose();
        shipInterior = null;
    }
    if (cls.hasWalkableInterior) {
        try {
            shipInterior = new ShipInterior(shipModel.group, cls, newStationPos);
            systems.shipInterior = shipInterior;
        } catch (e) {
            console.warn('[TGO] Interior rebuild failed:', e.message);
        }
    }
    systems.shipInterior = shipInterior;

    // Update flight controller reference
    flightController.ship = shipModel;

    // Update power/damage for new stats
    powerSystem.reactorOutput = cls.stats.reactorOutput || 10;
    damageSystem.maxHull = cls.stats.hull || 100;
    damageSystem.maxShields = cls.stats.shields || 50;
    damageSystem.hull = damageSystem.maxHull;
    damageSystem.shields = damageSystem.maxShields;

    tablet.addDiscovery(`Ship class changed to ${cls.name} (${cls.class.toUpperCase()}).`, 'discovery');
    eventBus.emit('ship:classSelected', { classId, classData: cls });
}

// ============================================================
// SEAMLESS PLANET TRANSITION — registry-based framework
// ============================================================
// When the player jumps to a new planet via hyperspace, the
// PlanetTransition framework orchestrates dispose → recompute → create
// across all registered systems in deterministic order.
//
// Flow: FLIGHT → charge → flash → [dispose/recreate] → DESCENT → SURFACE

const planetTransition = new PlanetTransition(scene, camera, {
    hashSeed,
    classifyRule,
    generatePlanetName,
    derivePlanetMood,
    derivePlanetFrequency,
    frequencyToNote,
});

// ---- Register systems in the order they should be CREATED ----
// (Dispose runs in reverse order automatically)

// 1. Active systems — disable input handlers and HUD before any disposal
planetTransition.register('activeSystems', {
    dispose: () => {
        gameManager.resetDescent();
        walker.disable();
        miningSystem.disable();
        flightController.disable();
        weaponSystem.disable();
        scannerSystem.disable();
        hyperspaceSystem.disable();
        shipHUD.hide();
        document.getElementById('crosshair').classList.remove('visible');
        document.getElementById('controls-hint').classList.remove('visible');
    },
});

// 2. Planet identity — updates outer-scope variables, URL, and color objects
//    Must run before terrain/vegetation so they pick up new fogColor, sunColor, etc.
planetTransition.register('planetIdentity', {
    create: (planetData) => {
        planetRule = planetData.rule;
        planetSeed = planetData.seed;
        planetName = planetData.name;
        classification = planetData.classification;
        planetMood = planetData.mood;
        planetFreq = planetData.freq;
        planetNote = planetData.note;

        // Sync planet identity to GameManager's systems object
        systems.planetRule = planetRule;
        systems.planetSeed = planetSeed;
        systems.planetName = planetName;
        systems.classification = classification;
        systems.planetMood = planetMood;
        systems.planetFreq = planetFreq;
        systems.planetNote = planetNote;

        // Update Gemini context for new planet
        geminiService.setPlanetContext({
            name: planetName, rule: planetRule,
            ruleClass: classification.class, ruleLabel: classification.label,
            atmosphere: planetMood.moodName,
            frequency: `${planetFreq.frequency.toFixed(2)}Hz`,
            musicalNote: planetNote.display,
            brainwaveBand: planetMood.bandLabel,
            mood: planetMood.moodName,
            schumannResonant: planetMood.isSchumannResonant,
            fragmentsFound: terminalSystem.getFragmentCount(),
        });

        // Update URL so refresh works (no page reload)
        history.replaceState(null, '', `landing.html?rule=${planetData.rule}&seed=${planetData.seed}`);

        // Recalculate colors (mutates existing THREE.Color objects in-place)
        skyTopColor.set(...planetData.mood.sky.topColor);
        skyBottomColor.set(...planetData.mood.sky.bottomColor);
        fogColor.set(...planetData.mood.sky.fogColor);
        sunColor.set(...planetData.mood.sky.sunColor);
        fc = planetData.mood.sky.fogColor;
        atmosTint = `rgba(${Math.round(fc[0]*255)},${Math.round(fc[1]*255)},${Math.round(fc[2]*255)},`;
        moodFogDensity = planetData.mood.atmosphere.fogDensity;
    },
});

// 3. Terrain — dispose old geometry, create new world from CA rule + seed
planetTransition.register('terrain', {
    dispose: () => terrainManager.dispose(),
    create: (planetData) => {
        terrainManager = new TerrainManager(scene, {
            rule: planetData.rule,
            seed: planetData.seed,
            moistureRule: (planetData.rule + 73) & 0xFF,
        });
        const newSunDir = new THREE.Vector3(0.5, 0.3, 0.4).normalize();
        terrainManager.createWater(fogColor, newSunDir);

        // Update triplanar material for new planet colors
        if (triplanarMaterial && triplanarMaterial.uniforms) {
            triplanarMaterial.uniforms.uFogColor.value.copy(fogColor);
            triplanarMaterial.uniforms.uFogDensity.value = moodFogDensity;
            triplanarMaterial.uniforms.uSunColor.value.copy(sunColor);
            triplanarMaterial.uniforms.uSkyColor.value.copy(skyTopColor);
        }
        terrainManager.setTriplanarMaterial(triplanarMaterial);
        systems.terrainManager = terrainManager; // Sync to GameManager
        return terrainManager;
    },
});

// 10. Scene environment — fog, sky dome, lighting, post-processing
planetTransition.register('sceneEnvironment', {
    updateColors: (colors, planetData) => {
        // Scene fog
        scene.fog.color.copy(fogColor);
        scene.fog.density = moodFogDensity;

        // Sky dome
        skyDome.material.uniforms.uTopColor.value.copy(skyTopColor);
        skyDome.material.uniforms.uMidColor.value.copy(skyBottomColor);
        skyDome.material.uniforms.uBottomColor.value.copy(fogColor);
        skyDome.material.uniforms.uFogColor.value.copy(fogColor);
        skyDome.material.uniforms.uSunColor.value.copy(sunColor);

        // Lighting
        sunLight.color.copy(sunColor);
        ambientLight.color.copy(skyBottomColor);
        ambientLight.intensity = planetData.mood.atmosphere.ambientLight;
        hemiLight.color.copy(skyTopColor);
        groundFillMat.color.copy(fogColor);

        // Bloom strength
        perfManager.setBloomBaseStrength(planetData.mood.atmosphere.bloomStrength);

        // Ray-marched atmosphere
        if (atmospherePass) atmospherePass.setAtmosphere({
            skyColor: skyTopColor,
            fogColor: fogColor,
            sunColor: sunColor,
            fogDensity: moodFogDensity,
            scatterStrength: planetData.mood.atmosphere.bloomStrength > 0.4 ? 1.2 : 0.8,
        });

        // Volumetric clouds
        if (volumetricClouds) {
            const newSunDir = new THREE.Vector3(0.5, 0.3, 0.4).normalize();
            volumetricClouds.setAtmosphere({
                skyColor: skyTopColor,
                sunColor: sunColor,
                sunDirection: newSunDir,
                coverage: planetData.mood.atmosphere.fogDensity > 0.003 ? 0.55 : 0.35,
            });
        }

        // SSR
        if (ssrPass) {
            ssrPass.setSkyColor(skyTopColor);
            ssrPass.setSunColor(sunColor);
        }

        // Wind field
        if (windField) {
            windField.baseStrength = planetData.mood.atmosphere.windStrength || 0.15;
        }
    },
});

        );
    },
});

let encounterState = 'waiting'; // waiting | approaching | talking | complete

// Helper to keep encounterState in sync with systems object
function setEncounterState(state) {
    encounterState = state;
    if (typeof systems !== 'undefined') systems.encounterState = state;
}

const dialogue = new DialogueSystem({
    onDialogueComplete: () => {
        if (encounterState === 'talking') {
            beingDialogueIndex++;
            if (beingDialogueIndex >= BEING_DIALOGUES.length) {
                setEncounterState('complete');
                // Unlock the key input on the tablet
                tablet.unlockKeyInput();
                tablet.addDiscovery(
                    'The Mysterious Being revealed the truth: this universe runs on Cellular Automata. ' +
                    'It asks for the "Key of Insight" to awaken the Architect.',
                    'encounter'
                );
            } else {
                setEncounterState('approaching');
            }
        }
        // Re-enable walking
        walker.enable();
    },
    onChoice: (choiceId) => {
        if (choiceId === 'ask_key') {
            // Show final dialogue about the key
            dialogue.startDialogue('THE BEING', [
                'The Key of Insight… it is not a word or a cipher.',
                'It is a bridge between your consciousness and the Architect who shaped this cosmos.',
                'Open your Tablet. You will find a place to enter it.',
                'When the Key is given, the Architect will speak… and your understanding of this universe will change forever.',
            ], { speakerColor: '#88ffcc' });
        } else if (choiceId === 'ask_rules') {
            dialogue.startDialogue('THE BEING', [
                'Each world is born from a Rule — a number between 0 and 255.',
                `This world… it was born from Rule ${planetRule}. A Class ${classification.class} pattern.`,
                classification.class === 3
                    ? 'Class 3 — Chaotic. The most beautiful patterns emerge from chaos. Like life itself.'
                    : classification.class === 4
                    ? 'Class 4 — Complex. The edge of chaos. These patterns can compute, can think, can dream.'
                    : classification.class === 2
                    ? 'Class 2 — Periodic. Orderly. Predictable. Like a heartbeat that never falters.'
                    : 'Class 1 — Uniform. Silent. Still. The void between thoughts.',
                'Every mountain you see, every valley you walk through — all computed from that single number.',
            ], { speakerColor: '#88ffcc' });
        } else if (choiceId === 'leave') {
            setEncounterState('complete');
        }
    },
});

// The Being's dialogue tree
const BEING_DIALOGUES = [
    // First encounter
    {
        lines: [
            'You have arrived.',
            'I have watched the patterns form beneath my gaze for aeons…',
            'The stone beneath your feet. The sky above. The mountains on the horizon.',
            'They are not random.',
            'They are computed.',
        ],
        speakerColor: '#88ffcc',
    },
    // Second conversation (when approached again)
    {
        lines: [
            'The patterns in the stone… they are not random. To see the truth, you must provide the Key of Insight.',
            'I am what remains of the first consciousness to understand this universe\'s source code.',
            'These worlds — all of them — grow from simple rules. Cellular Automata.',
            'Two hundred and fifty-six possible rules. Each one a different universe.',
        ],
        speakerColor: '#88ffcc',
        choices: [
            { text: 'What are these "rules"?', id: 'ask_rules' },
            { text: 'Tell me about the Key of Insight.', id: 'ask_key' },
            { text: 'I need to explore more first.', id: 'leave' },
        ],
    },
];

function triggerBeingDialogue() {
    // If scripted dialogues exhausted but Gemini is active, use AI dialogue
    if (beingDialogueIndex >= BEING_DIALOGUES.length && geminiService.isReady()) {
        triggerAIDialogue();
        return;
    }
    if (beingDialogueIndex >= BEING_DIALOGUES.length) return;

    setEncounterState('talking');
    const d = BEING_DIALOGUES[beingDialogueIndex];

    // Disable walking during dialogue
    walker.disable();

    // Log the discovery
    if (beingDialogueIndex === 0) {
        tablet.addDiscovery(`Encountered the Mysterious Being on ${planetName}.`, 'encounter');
    }

    dialogue.startDialogue('THE BEING', d.lines, {
        speakerColor: d.speakerColor || '#88ffcc',
        choices: d.choices || null,
    });

    // Mark as approached
    if (npcManager.mysteriousBeing) {
        npcManager.mysteriousBeing.hasBeenApproached = true;
    }
}

/**
 * AI-powered dialogue — uses Gemini to generate Being responses.
 * Triggered after scripted dialogue is exhausted and API key validated.
 */
async function triggerAIDialogue() {
    setEncounterState('talking');
    walker.disable();

    // Update fragment count in Gemini context
    geminiService.setPlanetContext({
        ...geminiService.planetContext,
        fragmentsFound: terminalSystem.getFragmentCount(),
    });

    // Ask Gemini for a contextual greeting
    const response = await geminiService.chat(
        'The explorer approaches you again. Greet them and offer wisdom about this world.'
    );

    if (response) {
        // Split long responses into multiple lines
        const lines = response.match(/.{1,120}[.!?…]/g) || [response];
        dialogue.startDialogue('THE BEING', lines, {
            speakerColor: '#88ffcc',
            choices: [
                { text: 'Tell me about cipher fragments.', id: 'ai_fragments' },
                { text: 'What should I explore next?', id: 'ai_quest' },
                { text: 'I must go.', id: 'leave' },
            ],
        });
    } else {
        dialogue.startDialogue('THE BEING', [
            'The cosmic winds are restless… the Architect\'s voice cannot reach me now.',
            'Return when the Key of Insight burns brighter.',
        ], { speakerColor: '#88ffcc' });
    }
}

// Handle AI dialogue choices
eventBus.on('gemini:validated', () => {
    tablet.addDiscovery('The Architect awakens. The Being now speaks with cosmic wisdom.', 'encounter');
});

// Extend onChoice for AI-powered responses
const originalOnChoice = dialogue.onChoice;
dialogue.onChoice = async (choiceId, choice) => {
    if (choiceId === 'ai_fragments' && geminiService.isReady()) {
        walker.disable();
        const resp = await geminiService.chat(
            `The explorer asks about cipher fragments. They have ${terminalSystem.getFragmentCount()}/5. Guide them.`
        );
        if (resp) {
            const lines = resp.match(/.{1,120}[.!?…]/g) || [resp];
            dialogue.startDialogue('THE BEING', lines, { speakerColor: '#88ffcc' });
        }
        return;
    }
    if (choiceId === 'ai_quest' && geminiService.isReady()) {
        walker.disable();
        const resp = await geminiService.chat(
            'The explorer wants guidance. Suggest what they should explore or do next on this planet.'
        );
        if (resp) {
            const lines = resp.match(/.{1,120}[.!?…]/g) || [resp];
            dialogue.startDialogue('THE BEING', lines, { speakerColor: '#88ffcc' });
        }
        return;
    }
    // Fall through to original handler
    if (originalOnChoice) originalOnChoice(choiceId, choice);
};

// Descent, landing, and phase transitions are now handled by GameManager

// ============================================================
// RESIZE
// ============================================================
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    // Resolution scaler handles renderer.setSize with scale factor
    resolutionScaler.resize(window.innerWidth, window.innerHeight);
    const scaled = resolutionScaler.getScaledSize();
    pipeline.setSize(scaled.width, scaled.height);
    if (taaPass) taaPass.setSize(scaled.width, scaled.height);
    if (ssaoPass) ssaoPass.setSize(scaled.width, scaled.height);
    if (atmospherePass) atmospherePass.setSize(scaled.width, scaled.height);
    if (volumetricClouds) volumetricClouds.setSize(scaled.width, scaled.height);
    if (ssrPass) ssrPass.setSize(scaled.width, scaled.height);
});

// ============================================================
// GAME MANAGER — structured game loop (replaces monolithic animate())
// ============================================================
console.log('[TGO] Init: All systems ready, creating GameManager...');
setLoading(100, 'Entering atmosphere...');

// Quick fade — the descent animation IS the loading experience
setTimeout(() => {
    loadingEl.classList.add('fade');
    setTimeout(() => { loadingEl.style.display = 'none'; }, 1200);
}, 300);

// Collect all system instances into a single object for GameManager
const systems = {
    // Core
    renderer,
    scene,
    camera,

    // Terrain & Environment
    terrainManager,
    skyDome,
    grassSystem,
    rockScatter,
    alienFlora,
    atmosphericParticles,
    groundFill,
    windField,
    weatherSystem,
    triplanarMaterial,

    // Player
    walker,
    miningSystem,
    miningHUD,
    inventory,

    // Ship
    shipModel,
    flightController,
    weaponSystem,
    scannerSystem,
    hyperspaceSystem,
    shipHUD,
    powerSystem,
    damageSystem,

    // NPCs & Creatures
    npcManager,
    creatureSystem,

    // UI
    dialogue,
    tablet,

    // Audio
    audioSystem,

    // Rendering pipeline
    composer,
    taaPass,
    ssaoPass,
    bloomPass,
    ssrPass,
    autoExposure,
    volumetricClouds,
    atmospherePass,
    motionBlurPass,
    dofPass,
    contactShadowPass,
    ssgiPass,
    lensFlarePass,
    lensDirtPass,
    fxaaPass,
    combinedGradePass,
    perfManager,
    csmManager,

    // Lighting
    sunLight,
    ambientLight,
    hemiLight,

    // Terminal & AI
    terminalSystem,
    geminiService,

    // Quest system
    questSystem,

    // Ship crew/interior
    stationManager,
    shipInterior,
    hudManager,

    // Planet identity (mutable — updated on planet transition)
    planetName,
    planetRule,
    planetSeed,
    planetMood,
    planetFreq,
    planetNote,
    classification,
    atmosTint,

    // State
    shipGrounded,
    encounterState,

    // Callbacks
    autoSaveCallback: autoSave,
    triggerBeingDialogue,
    shipGroundCallback: () => {
        const shipX = camera.position.x + shipSpawnOffset.x;
        const shipZ = camera.position.z + shipSpawnOffset.z;
        const shipGroundH = terrainManager.getHeightAt(shipX, shipZ) || 5;
        shipModel.group.position.set(shipX, shipGroundH + 2.5, shipZ);
        shipModel.group.visible = true;
        systems.shipGrounded = true;
    },
};

const gameManager = new GameManager(systems);
gameManager.start();

console.log('[TGO] GameManager started — all systems orchestrated');

// ============================================================
// AUTO-LOGIN — guest session for save/load support
// ============================================================
(async () => {
    if (!api.isLoggedIn) {
        try {
            await api.loginAsGuest();
            console.log('[TGO] Logged in as guest — save system active');
        } catch (e) {
            console.warn('[TGO] Guest login failed (server offline?) — saves disabled:', e.message);
        }
    } else {
        console.log('[TGO] Resuming existing session');
    }
})();

// Debug access (expose to window for testing)
window._debug = {
    get scene() { return scene; },
    get camera() { return camera; },
    get npcManager() { return npcManager; },
    get walker() { return walker; },
    get terrain() { return terrainManager; },
    get dialogue() { return dialogue; },
    get tablet() { return tablet; },
    get encounterState() { return encounterState; },
    get ship() { return shipModel; },
    get flight() { return flightController; },
    get weapons() { return weaponSystem; },
    get scanner() { return scannerSystem; },
    get hyperspace() { return hyperspaceSystem; },
    get mining() { return miningSystem; },
    get inventory() { return inventory; },
    get perf() { return perfManager; },
    get csm() { return csmManager; },
    get phase() { return gameManager.currentPhase; },
    get weather() { return weatherSystem; },
    get lensFlare() { return lensFlarePass; },
    get lensDirt() { return lensDirtPass; },
    get resolution() { return resolutionScaler; },
    get power() { return powerSystem; },
    get damage() { return damageSystem; },
    get terminal() { return terminalSystem; },
    get gemini() { return geminiService; },
    get gameManager() { return gameManager; },
    get quests() { return questSystem; },
    get hudManager() { return hudManager; },
    get stations() { return stationManager; },
    get interior() { return shipInterior; },
    get api() { return api; },
    setWeather: (state) => weatherSystem && weatherSystem.setWeather(state),
    setResolution: (scale) => resolutionScaler && resolutionScaler.setScale(scale),
    warpTo: (rule, seed) => planetTransition.execute(rule, seed),
    collectFragment: (id) => terminalSystem.collectFragment(id),
    selectShip: (classId) => selectShipClass(classId),
    showShipSelect: () => { shipSelectOverlay.style.display = 'block'; },
    save: () => autoSave(),
};

</script>
